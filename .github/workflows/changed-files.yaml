# Downstream changes: rhobs/ci.patch; refresh with rhobs/release.sh sync-ci.

name: changed-files

on:
    workflow_call:
      outputs:
        non-markdown-files:
          description: "changed files list"
          value: ${{ jobs.changed-files.outputs.non-markdown-files }}

jobs:
  changed-files:
    # Map the job outputs to step outputs
    outputs:
      non-markdown-files : ${{ steps.changed-files.outputs.non-markdown-files}}
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo
      id: checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - name: get changed files
      id: changed-files
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
          files="$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA")"
          files="$(printf '%s\n' "$files" | { grep -iv '\.md$' || true; } | xargs)"
        else
          files=all
        fi
        echo "non-markdown-files=$files" >> "$GITHUB_OUTPUT"
    - run: |
        echo "${{ steps.changed-files.outputs.non-markdown-files}}"